}

/* =====================================================================
   5. MOTEUR DE REPOS — fin calculée en heure absolue (résiste à la veille)
   ===================================================================== */
class RestTimer{
  constructor(onTick,onEnd){this.onTick=onTick;this.onEnd=onEnd;this.iv=null;this.endAt=0;this.total=0;this.paused=null;this.beeped=null;this._v=()=>this.loop();document.addEventListener("visibilitychange",this._v)}
  start(sec,endAt){this.stop();this.total=sec;this.endAt=endAt||Date.now()+sec*1000;this.paused=null;this.beeped=null;this.iv=setInterval(()=>this.loop(),200);this.loop()}
  left(){return this.paused!=null?this.paused:Math.max(0,(this.endAt-Date.now())/1000)}
  pause(){if(!this.iv)return;this.paused=this.left();clearInterval(this.iv);this.iv=null;this.onTick(this.paused,this.total)}
  resume(){if(this.paused==null)return;this.endAt=Date.now()+this.paused*1000;this.paused=null;this.iv=setInterval(()=>this.loop(),200);this.loop()}
  add(s){if(this.paused!=null)this.paused+=s;else this.endAt+=s*1000;this.total+=s;this.loop()}
  skip(){const taken=this.total-this.left();this.stop();this.onEnd(taken,true)}
  stop(){clearInterval(this.iv);this.iv=null;this.paused=null}
  destroy(){this.stop();document.removeEventListener("visibilitychange",this._v)}
  loop(){if(this.paused!=null||!this.iv)return;const l=this.left();this.onTick(l,this.total);const s=Math.ceil(l);
    if(s<=3&&s>=1&&this.beeped!==s){this.beeped=s;Sound.beep(660,.09)}
    if(l<=0){this.stop();Sound.beep(990,.15);Sound.beep(1320,.2,.2);this.onEnd(this.total,false)}}
}

function buildSteps(p,lv){
  const steps=[];
  lv.items.forEach((item,i)=>{
    const pr=prog(p,lv.num,i,item);const e=exo(p,pr.code);
    for(let s=1;s<=item.sets;s++){
      steps.push({t:"work",i,code:pr.code,name:e.n,unit:e.u,target:pr.target,set:s,sets:item.sets,rhythm:item.rhythm});
      if(s<item.sets&&item.restSet>0)steps.push({t:"rest",sec:item.restSet,why:"Repos entre séries"});
    }
    if(i<lv.items.length-1&&item.restAfter>0)steps.push({t:"rest",sec:item.restAfter,why:"Repos avant l'exercice suivant"});
  });
  return steps;
}
function applyProgress(p,lv,sets){
  // +pas si toutes les séries à l'objectif ; propose la variante au seuil ; objectif repère pour le niveau
  const out={up:[],swaps:[],level:false};
  lv.items.forEach((item,i)=>{
    const pr=prog(p,lv.num,i,item);const mine=sets.filter(x=>x.i===i);
    if(mine.length<item.sets)return;
    if(mine.every(x=>x.reps>=x.target)){
      if(item.step>0){pr.target+=item.step;out.up.push({code:pr.code,target:pr.target})}
      if(item.swap&&pr.code===item.code&&pr.target>=item.swap.at)out.swaps.push({i,from:pr.code,to:item.swap.to,start:item.swap.start});
    }
  });
  if(lv.up){const hit=sets.filter(x=>x.code===lv.up.code);if(hit.length&&hit.every(x=>x.reps>=lv.up.reps))out.level=true}
  return out;
}

        :`<div class="hero"><span class="lbl">Maintien</span><div class="huge" id="hv">0:00</div></div>
          <button class="btn wide" id="hs" style="min-height:64px;font-size:1.2rem">Démarrer le maintien</button>`}
        <p class="muted small" style="text-align:center">${nxt?nxt.t==="rest"?`Ensuite : repos ${fmt(nxt.sec)}`:`Ensuite : ${esc(nxt.code)}`:"Dernière série de la séance"}</p>
        ${e.t&&e.t.length?`<details><summary>Technique</summary><ol class="small">${e.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${e.q?`<a class="small" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">Démonstrations vidéo</a>`:""}</details>`:""}
        <button class="btn ghost sm" id="sk" style="align-self:center">Passer cette série</button></div>`;
      if(p==="carnet")animate(el.querySelector(".stage svg"),e.fig,st.unit==="sec"?5000:2600);
      const g=id=>el.querySelector("#"+id);
      const log=v=>{A.sets.push({i:st.i,code:st.code,set:st.set,target:st.target,reps:v,unit:st.unit,restPlanned:null,restTaken:null});A.idx++;
        const n=steps[A.idx];if(n&&n.t==="rest")A.restEndsAt=Date.now()+n.sec*1000;Active.set(A);draw()};
      if(st.unit==="reps"){g("mn").onclick=()=>{reps=Math.max(0,reps-1);g("rv").textContent=reps};g("pl").onclick=()=>{reps=Math.min(300,reps+1);g("rv").textContent=reps};g("ok").onclick=()=>log(reps)}
      else{let t0=0;g("hs").onclick=()=>{if(hold){const v=Math.round((Date.now()-t0)/1000);clearInterval(hold);hold=null;log(v);return}
          Sound.beep(660);t0=Date.now();g("hs").textContent="Arrêter";g("hs").className="btn warn wide";
          hold=setInterval(()=>{const v=(Date.now()-t0)/1000;g("hv").textContent=fmt(v);if(v>=st.target){clearInterval(hold);hold=null;Sound.beep(990,.15);Sound.beep(1320,.2,.2);log(st.target)}},150)}}
      g("sk").onclick=()=>{A.idx++;const n=steps[A.idx];if(n&&n.t==="rest")A.restEndsAt=Date.now()+n.sec*1000;Active.set(A);draw()};
    }else{
      const nw=steps.slice(A.idx).find(s=>s.t==="work");const ne=nw?exo(p,nw.code):null;
      el.innerHTML=`<div class="wrap rest">${top()}
        <div class="hero"><span class="lbl">${esc(st.why)}</span><h2>Repos</h2></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--rest)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <div class="c"><div class="huge" id="rl">${fmt(st.sec)}</div><span class="muted small">sur ${fmt(st.sec)}</span></div></div>
        <div class="g3"><button class="btn ghost" id="pz">Pause</button><button class="btn ghost" id="ad">+15 s</button><button class="btn warn" id="sk">Passer</button></div>
        ${nw?`<div class="card"><span class="lbl">Prochaine série</span><div class="row between"><strong>${esc(nw.code)} · ${esc(ne.n)}</strong><span class="num">${nw.set}/${nw.sets} · ${unitTxt(nw.unit,nw.target)}</span></div></div>`:""}
        <p class="muted small" style="text-align:center">La série suivante s'affiche toute seule à la fin du repos, avec un signal sonore.</p></div>`;
      el.querySelector("#pz").onclick=()=>timer.paused!=null?timer.resume():timer.pause();
      el.querySelector("#ad").onclick=()=>{timer.add(15);A.restEndsAt=(A.restEndsAt||Date.now())+15000;Active.set(A)};
      el.querySelector("#sk").onclick=()=>timer.skip();
      const end=A.restEndsAt&&A.restEndsAt>Date.now()?A.restEndsAt:null;
      timer.start(st.sec,end||Date.now()+st.sec*1000);
    }
    el.querySelector("#q").onclick=quitAsk;
  }
  function quitAsk(){timer.pause();const box=document.createElement("div");box.className="card";
    box.innerHTML=`<strong>Arrêter la séance ?</strong><p class="muted small">${A.sets.length} série(s) faites.</p><div class="g2"><button class="btn" id="qs">${A.sets.length?"Enregistrer et arrêter":"Arrêter"}</button><button class="btn ghost" id="qb">Continuer</button></div>`;
    el.querySelector(".wrap").prepend(box);box.querySelector("#qb").onclick=()=>{box.remove();timer.resume()};
    box.querySelector("#qs").onclick=()=>{if(A.sets.length){saveSession("aborted")}close()}}
  function saveSession(status){
    const res=status==="done"?applyProgress(p,lv,A.sets):{up:[],swaps:[],level:false};
    S.sessions.push({id:A.id,date:today(),prog:p,level:lv.num,startedAt:A.startedAt,endedAt:Date.now(),status,sets:A.sets.map(x=>({code:x.code,i:x.i,set:x.set,target:x.target,reps:x.reps,unit:x.unit,restPlanned:x.restPlanned,restTaken:x.restTaken}))});
    save();return res;
  }
  function finish(){
    timer.stop();const res=saveSession("done");Active.set(null);
    const tot=A.sets.reduce((a,x)=>a+(x.unit==="reps"?x.reps:0),0),ok=A.sets.filter(x=>x.reps>=x.target).length;
    el.innerHTML=`<div class="wrap"><span class="lbl">Séance terminée</span><h1>Niveau ${lv.num}</h1>
      <div class="g3"><div class="stat"><span class="lbl">Séries</span><b>${ok}/${A.sets.length}</b></div><div class="stat"><span class="lbl">Répét.</span><b>${tot}</b></div><div class="stat"><span class="lbl">Durée</span><b>${fmt((Date.now()-A.startedAt)/1000)}</b></div></div>
      ${res.up.length?`<div class="card"><h3>Objectifs relevés</h3>${res.up.map(u=>`<p><span class="code">${esc(u.code)}</span> → <strong class="num">${u.target}</strong> par série</p>`).join("")}</div>`:`<div class="card"><p>Aucun objectif relevé cette fois : retente les mêmes chiffres à la prochaine séance.</p></div>`}
      ${res.swaps.map((s,k)=>`<div class="card" style="border:2px solid var(--go)"><h3>Variante débloquée</h3><p>Tu peux remplacer <span class="code">${esc(s.from)}</span> par <span class="code">${esc(s.to)}</span> ${esc(exo(p,s.to).n)} (départ ${s.start}).</p><div class="g2"><button class="btn" data-sw="${k}">Passer à ${esc(s.to)}</button><button class="btn ghost" data-swno="${k}">Plus tard</button></div></div>`).join("")}
      ${res.level&&levelDef(p,lv.num+1)?`<div class="card" style="border:2px solid var(--rest)"><h3>Objectif repère atteint</h3><p>${esc(lv.up.code)} ${lv.up.reps} sur toutes les séries : tu peux passer au niveau ${lv.num+1}.</p><div class="g2"><button class="btn warn" id="lvup">Passer au niveau ${lv.num+1}</button><button class="btn ghost" id="lvno">Rester</button></div></div>`:""}
      <button class="btn wide" id="done">Terminer</button></div>`;
    el.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const s=res.swaps[+b.dataset.sw];S.progress[pKey(p,lv.num,s.i)]={code:s.to,target:s.start};save();b.closest(".card").innerHTML=`<p>C'est fait : ${esc(s.to)} à partir de la prochaine séance.</p>`});
    el.querySelectorAll("[data-swno]").forEach(b=>b.onclick=()=>b.closest(".card").remove());
    const lu=el.querySelector("#lvup");if(lu){lu.onclick=()=>{S.settings.level=lv.num+1;save();lu.closest(".card").innerHTML=`<p>Bienvenue au niveau ${lv.num+1}.</p>`};el.querySelector("#lvno").onclick=()=>el.querySelector("#lvno").closest(".card").remove()}
    el.querySelector("#done").onclick=close;
  }
  draw();
}

function lineChart(pts,{unit="",color="var(--go)"}={}){
  if(pts.length<2)return `<p class="muted small">Il faut au moins deux séances pour tracer une courbe.</p>`;
  const W=320,H=170,L=34,R=10,T=14,B=26;const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.1;lo=Math.max(0,lo-pad);hi=hi+pad;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.y).toFixed(1)}`).join("");
  const area=path+`L${x(pts.length-1).toFixed(1)} ${H-B}L${x(0).toFixed(1)} ${H-B}Z`;
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(t*10)/10}</text>`).join("")}
   <path d="${area}" fill="${color}" opacity=".12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].y)}" r="4.5" fill="${color}"/>
   ${lab.map(i=>`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${pts[i].l}</text>`).join("")}</svg>`;
}

   <div class="card">${nums.length?`<ul class="hist">${nums.map(n=>`<li><span>Niveau ${n}${S.custom.levels[n].name?" · "+esc(S.custom.levels[n].name):""} · ${S.custom.levels[n].items.length} exercices</span><button class="btn ghost sm" data-e="${n}">Modifier</button></li>`).join("")}</ul>`:`<p class="muted">Aucun niveau pour l'instant.</p>`}
    <div class="g2"><div class="f"><label for="nn">Numéro</label><input id="nn" type="number" min="1" max="99" inputmode="numeric" value="${(nums[nums.length-1]||0)+1}"></div><div style="display:flex;align-items:flex-end"><button class="btn wide" id="add">Créer le niveau</button></div></div></div>
   <div class="card"><h3>Sauvegarde</h3><p class="muted small">Exporte tout (séances, mesures, niveaux) régulièrement : sur iPhone, Safari peut effacer les données d'un site non installé.</p>
    <div class="g2"><button class="btn ghost" id="ex">Exporter</button><button class="btn ghost" id="im">Importer</button></div>
    <textarea id="io" placeholder="Le code de sauvegarde apparaît ici. Pour importer, colle-le puis appuie sur Importer." hidden></textarea>
    <input type="file" id="fi" accept="application/json,.json" hidden></div>
   <div class="card"><h3>Réglages</h3><label class="row" style="color:var(--ink)"><input type="checkbox" id="snd" style="width:auto" ${S.settings.sound?"checked":""}> Signaux sonores</label></div>`;
  V.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{edit.lv=+b.dataset.e;render()});
  V.querySelector("#add").onclick=()=>{const n=+V.querySelector("#nn").value;if(!(n>=1))return toast("Numéro invalide.");if(S.custom.levels[n])return toast("Le niveau "+n+" existe déjà.");S.custom.levels[n]={name:"",items:[],up:null};save();edit.lv=n;render()};
  V.querySelector("#snd").onchange=e=>{S.settings.sound=e.target.checked;save()};
  const io=V.querySelector("#io");
  V.querySelector("#ex").onclick=async()=>{const data=JSON.stringify(S);
    try{const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="carnet-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}catch(e){}
    io.hidden=false;io.value=data;try{await navigator.clipboard.writeText(data);toast("Sauvegarde copiée et téléchargée")}catch(e){io.select();toast("Sauvegarde affichée : copie-la")}};
  V.querySelector("#im").onclick=()=>{if(io.hidden||!io.value.trim()){io.hidden=false;V.querySelector("#fi").click();return}importData(io.value)};
  V.querySelector("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)};
}
function importData(txt){try{const d=JSON.parse(txt);if(!d||d.version!==VERSION||!Array.isArray(d.sessions))throw 0;S=Object.assign(fresh(),d);save();toast("Données importées");render()}catch(e){toast("Ce fichier n'est pas une sauvegarde du Carnet.")}}
function editLevel(n){
  const L=S.custom.levels[n];
  const rows=L.items.map((it,i)=>{const e=S.custom.exercises[it.code]||{};const sw=it.swap||{};return `<div class="ed" data-i="${i}">
    <div class="f"><label>Code</label><input data-k="code" value="${esc(it.code)}" autocapitalize="characters"></div>
    <div class="f w2"><label>Nom</label><input data-k="n" value="${esc(e.n||"")}"></div>
    <div class="f"><label>Unité</label><select data-k="u"><option value="reps">rép.</option><option value="sec" ${e.u==="sec"?"selected":""}>sec</option></select></div>
    <div class="f"><label>Séries</label><input data-k="sets" type="number" inputmode="numeric" value="${it.sets}"></div>
    <div class="f"><label>Départ</label><input data-k="start" type="number" inputmode="numeric" value="${it.start}"></div>
    <div class="f"><label>Pas</label><input data-k="step" type="number" inputmode="numeric" value="${it.step}"></div>
    <div class="f"><label>Rythme</label><select data-k="rhythm">${["normal","rapide","lent"].map(r=>`<option ${it.rhythm===r?"selected":""}>${r}</option>`).join("")}</select></div>
    <div class="f"><label>Repos série</label><input data-k="restSet" type="number" inputmode="numeric" value="${it.restSet}"></div>
    <div class="f"><label>Repos après</label><input data-k="restAfter" type="number" inputmode="numeric" value="${it.restAfter}"></div>
    <div class="f"><label>Variante à</label><input data-k="swapAt" type="number" inputmode="numeric" value="${sw.at||""}"></div>
    <div class="f"><label>Code var.</label><input data-k="swapTo" value="${esc(sw.to||"")}" autocapitalize="characters"></div>
    <div class="f w2"><label>Nom variante</label><input data-k="swapN" value="${esc((S.custom.exercises[sw.to]||{}).n||"")}"></div>
    <div class="f"><label>Départ var.</label><input data-k="swapStart" type="number" inputmode="numeric" value="${sw.start||""}"></div>
    <div class="row w4" style="justify-content:flex-end"><button class="btn ghost sm" data-up="${i}" ${i?"":"disabled"}>Monter</button><button class="btn ghost sm" data-del="${i}">Supprimer</button></div></div>`}).join("");
  V.innerHTML=`<header class="row between"><div><span class="lbl">Mes niveaux</span><h1>Niveau ${n}</h1></div><button class="btn ghost sm" id="back">Retour</button></header>
   <div class="card"><div class="f"><label for="ln">Nom du niveau (facultatif)</label><input id="ln" value="${esc(L.name||"")}"></div>
    <p class="small muted">Repos en secondes. « Pas » : ce qu'on ajoute à l'objectif après une séance réussie. Les champs « variante » sont facultatifs.</p></div>
   ${rows||`<p class="muted">Aucun exercice. Ajoute le premier ci-dessous.</p>`}
   <button class="btn ghost wide" id="addi">Ajouter un exercice</button>
   <div class="card"><h3>Passage au niveau suivant</h3><div class="g2"><div class="f"><label for="uc">Exercice repère (code)</label><input id="uc" value="${esc(L.up?L.up.code:"")}" autocapitalize="characters"></div><div class="f"><label for="ur">Objectif par série</label><input id="ur" type="number" inputmode="numeric" value="${L.up?L.up.reps:""}"></div></div></div>
   <div class="g2"><button class="btn" id="sv">Enregistrer</button><button class="btn ghost" id="dl">Supprimer le niveau</button></div>`;
  const collect=()=>{L.name=V.querySelector("#ln").value.trim();
    L.items=[...V.querySelectorAll(".ed")].map(r=>{const v=k=>r.querySelector(`[data-k="${k}"]`).value.trim();const num=(k,d)=>{const x=parseInt(v(k),10);return isNaN(x)?d:x};
      const code=v("code").toUpperCase()||"?";S.custom.exercises[code]={n:v("n")||code,u:v("u")};
      const to=v("swapTo").toUpperCase();if(to)S.custom.exercises[to]={n:v("swapN")||to,u:v("u")};
      return {code,sets:num("sets",6),start:num("start",5),step:num("step",1),restSet:num("restSet",25),restAfter:num("restAfter",180),rhythm:v("rhythm"),swap:to&&num("swapAt",0)?{at:num("swapAt",0),to,start:num("swapStart",num("start",5))}:null}});
    const uc=V.querySelector("#uc").value.trim().toUpperCase(),ur=parseInt(V.querySelector("#ur").value,10);L.up=uc&&ur?{code:uc,reps:ur}:null};
  V.querySelector("#back").onclick=()=>{collect();save();edit.lv=null;render()};
  V.querySelector("#addi").onclick=()=>{collect();L.items.push({code:"",sets:6,start:5,step:1,restSet:25,restAfter:180,rhythm:"normal",swap:null});save();editLevel(n)};
  V.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{collect();L.items.splice(+b.dataset.del,1);save();editLevel(n)});
  V.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{collect();const i=+b.dataset.up;[L.items[i-1],L.items[i]]=[L.items[i],L.items[i-1]];save();editLevel(n)});
  V.querySelector("#sv").onclick=()=>{collect();Object.keys(S.progress).filter(k=>k.startsWith("custom:"+n+":")).forEach(k=>delete S.progress[k]);save();toast("Niveau "+n+" enregistré");edit.lv=null;render()};
  const dl=V.querySelector("#dl");dl.onclick=()=>{if(dl.dataset.c){delete S.custom.levels[n];save();edit.lv=null;render()}else{dl.dataset.c="1";dl.textContent="Confirmer la suppression";dl.className="btn warn"}};
}
document.querySelectorAll("nav.tab button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view!=="edit")edit.lv=null;render()});

/* ---------- démarrage ---------- */
(async()=>{await Store.open();const d=await Store.load();if(d&&d.version===VERSION)S=Object.assign(fresh(),d);render();
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")){navigator.serviceWorker.register("sw.js").catch(()=>{})}})();
})();
</script>

</body>
</html>
